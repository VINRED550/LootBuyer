# ─────────────────────────────────────────────
#  LootBuyer — resource buyer GUI
#  Messages and menu texts live in plugins/LootBuyer/lang/
# ─────────────────────────────────────────────

# Message language: en, ru — or create your own lang/<code>.yml and set it here.
# Язык сообщений: ru — русский.
language: en

# How often prices change, in minutes. Player limits reset together with prices.
rotation-minutes: 60

# Announce in chat when prices change
announce-rotation: true

# How many items the buyer takes at once. 0 = every item in the list below.
# If lower than the number of items, a random set is picked on every rotation
# (like the buyers on anarchy servers).
items-per-rotation: 0

# Decimal places in prices
price-decimals: 1

# Only buy plain items: no custom names, enchantments or other data.
# Protects custom items from other plugins. Keep this on.
only-plain-items: true

# Price multipliers for ranks. Permission: lootbuyer.multiplier.<name>
# If a player has several, the highest one is used.
multipliers:
  vip: 1.1
  premium: 1.25

# Sound keys from https://minecraft.wiki/w/Sounds.json ("" = no sound)
sounds:
  sell: "entity.experience_orb.pickup"
  fail: "entity.villager.no"

menu:
  rows: 6
  # Item that fills empty slots. AIR = leave them empty.
  filler: GRAY_STAINED_GLASS_PANE
  # Clock with the rotation timer. -1 = hide.
  info-slot: 4
  # "Sell all" button. -1 = hide.
  sell-all-slot: 49
  sell-all-material: HOPPER
  # Slots for items. If omitted, the inner area of the menu is used (28 slots with 6 rows).
  # item-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]

# What the buyer takes.
#   key       — item id, used in placeholders (%lootbuyer_price_diamond%)
#   material  — https://jd.papermc.io/paper/1.21.4/org/bukkit/Material.html
#   price     — [min, max]: a random price in this range is picked on every rotation.
#               A single number means a fixed price. Price is per 1 item.
#   limit     — how many one player can sell until the next rotation. 0 = no limit.
items:
  # Ores and resources
  diamond:          { material: DIAMOND,          price: [90, 140],   limit: 128 }
  emerald:          { material: EMERALD,          price: [40, 70],    limit: 128 }
  netherite_scrap:  { material: NETHERITE_SCRAP,  price: [900, 1300], limit: 16 }
  gold_ingot:       { material: GOLD_INGOT,       price: [18, 30],    limit: 256 }
  iron_ingot:       { material: IRON_INGOT,       price: [10, 16],    limit: 512 }
  copper_ingot:     { material: COPPER_INGOT,     price: [2, 4],      limit: 1024 }
  coal:             { material: COAL,             price: [2, 4],      limit: 1024 }
  redstone:         { material: REDSTONE,         price: [1, 3],      limit: 1024 }
  lapis_lazuli:     { material: LAPIS_LAZULI,     price: [2, 4],      limit: 1024 }
  quartz:           { material: QUARTZ,           price: [3, 6],      limit: 512 }
  amethyst_shard:   { material: AMETHYST_SHARD,   price: [3, 6],      limit: 512 }
  obsidian:         { material: OBSIDIAN,         price: [6, 10],     limit: 256 }
  # Mob drops
  gunpowder:        { material: GUNPOWDER,        price: [4, 8],      limit: 512 }
  bone:             { material: BONE,             price: [1, 3],      limit: 1024 }
  string:           { material: STRING,           price: [2, 4],      limit: 1024 }
  rotten_flesh:     { material: ROTTEN_FLESH,     price: [0.5, 1.5],  limit: 1024 }
  spider_eye:       { material: SPIDER_EYE,       price: [2, 4],      limit: 512 }
  ender_pearl:      { material: ENDER_PEARL,      price: [15, 25],    limit: 128 }
  blaze_rod:        { material: BLAZE_ROD,        price: [15, 25],    limit: 128 }
  slime_ball:       { material: SLIME_BALL,       price: [5, 9],      limit: 256 }
  phantom_membrane: { material: PHANTOM_MEMBRANE, price: [10, 18],    limit: 128 }
  # Farming
  wheat:            { material: WHEAT,            price: [1, 2],      limit: 2048 }
  carrot:           { material: CARROT,           price: [1, 2],      limit: 2048 }
  potato:           { material: POTATO,           price: [1, 2],      limit: 2048 }
  sugar_cane:       { material: SUGAR_CANE,       price: [1, 3],      limit: 2048 }
  pumpkin:          { material: PUMPKIN,          price: [2, 4],      limit: 1024 }
  melon_slice:      { material: MELON_SLICE,      price: [0.5, 1],    limit: 2048 }
  cactus:           { material: CACTUS,           price: [1, 2],      limit: 2048 }
